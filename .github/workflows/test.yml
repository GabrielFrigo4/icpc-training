name: Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    check-binaries:
        name: 🔍 Verify Tracked Binaries
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Verify Tracked Binaries (make check-binaries)
              run: make check-binaries

    linux:
        name: 🐧 Linux (Ubuntu / GCC C++23)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Validate C++23 Toolchain & Sanitizers (modelo/main.cpp)
              run: |
                  trap 'rm -f /tmp/test_bin /tmp/test_dbg' EXIT
                  g++ -O3 -Wall -Wextra -Wconversion -Wshadow -std=c++23 modelo/main.cpp -o /tmp/test_bin
                  /tmp/test_bin
                  g++ -fsanitize=address,undefined -g -Wall -Wextra -Wconversion -Wshadow -std=c++23 modelo/main.cpp -o /tmp/test_dbg
                  /tmp/test_dbg

    freebsd:
        name: 😈 FreeBSD (15.x / Clang C++23)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test C++23 Compilers in FreeBSD VM
              uses: vmactions/freebsd-vm@v1
              with:
                  release: "15"
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      trap 'rm -f /tmp/test.cpp /tmp/test_bin /tmp/test_dbg' EXIT
                      uname -a
                      c++ --version
                      printf '%s\n' '#include <iostream>' 'int main() { std::cout << "FreeBSD Clang C++23 OK\n"; return 0; }' > /tmp/test.cpp
                      c++ -O3 -Wall -Wextra -Wconversion -Wshadow -std=c++23 /tmp/test.cpp -o /tmp/test_bin
                      /tmp/test_bin
                      c++ -fsanitize=address,undefined -g -Wall -Wextra -Wconversion -Wshadow -std=c++23 /tmp/test.cpp -o /tmp/test_dbg
                      /tmp/test_dbg
